services:
  no-ai-coauthor:
    build: .
    image: no-ai-coauthor:local
    user: ${NO_AI_COAUTHOR_USER:-10001:10001}
    volumes:
      - type: bind
        source: ${NO_AI_COAUTHOR_REPO:-.}
        target: /repo
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
